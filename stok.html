<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Bahan Ajar - UGM</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-left">
                <img src="assets/ut.png" alt="Logo UT" class="logo">
                <h1>Universitas Gadjah Mada</h1>
            </div>
            <div class="header-right">
                <span id="greeting" class="greeting"></span>
                <button id="logoutBtn" class="btn-secondary">Keluar</button>
            </div>
        </header>

        <nav class="dashboard-nav">
            <ul>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="stok.html" class="nav-link active">Informasi Mahasiswa</a></li>
                <li><a href="tracking.html" class="nav-link">Informasi Kelulusan</a></li>
                <li class="dropdown">
                    
                    <div class="dropdown-content">
                        <a href="#">Monitoring Progress DO Bahan Ajar</a>
                        <a href="#">Rekap Bahan Ajar</a>
                    </div>
                </li>
                <li class="dropdown">
                    <a href="#" class="nav-link">Materi Pembelajaran </a>
                    <div class="dropdown-content">
                        <a href="php.html">PHP</a>
                        <a href="html.html">HTML</a>
                        <a href="javascript.html">JavaScript</a>
                        <a href="css.html">CSS</a>
                    </div>
                </li>
               
        </nav>

        <main class="stok-main">
            <div class="stok-header">
                <h2>Informasi Detail Mahasiswa</h2>
                <button id="addStockBtn" class="btn-primary">Tambah Stok</button>
            </div>
            
            <table id="stockTable" class="stock-table">
                <thead>
                    <tr>
                        <th>NIM</th>
                        <th>Nama </th>
                        <th>Alamat</th>
                        <th>Email</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody">
                    <!-- Data akan diisi oleh JavaScript -->
                </tbody>
            </table>
        </main>
    </div>

    <!-- Modal Tambah Stok -->
    <div id="addStockModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Tambah Stok Baru</h2>
            <form id="addStockForm">
                <div class="form-group">
                    <label for="kodeBahan">Kode Mahasiswa</label>
                    <input type="int" id="kodeBahan" name="kodeBahan" required>
                </div>
                <div class="form-group">
                    <label for="namaBahan">Nama Mahasiswa</label>
                    <input type="text" id="namaBahan" name="namaBahan" required>
                </div>
                <div class="form-group">
                    <label for="stok">Alamat</label>
                    <input type="text" id="stok" name="stok" required>
                </div>
                <div class="form-group">
                    <label for="status">Email</label>
                    <input type="text" id="status" name="status" required>
                </div>
                <button type="submit" class="btn-primary">Simpan</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
